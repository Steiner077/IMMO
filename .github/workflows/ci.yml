name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: immo
          POSTGRES_PASSWORD: immo
          POSTGRES_DB: immo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://immo:immo@localhost:5432/immo_test?schema=public
      TEST_DATABASE_URL: postgresql://immo:immo@localhost:5432/immo_test?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - name: Typecheck
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: Beispiel-Kontoauszug erzeugen
        run: npm run sample:pdf -w @immo/api
      - name: Integrationstests (API + Datenbank)
        run: npm run test:integration -w @immo/api
      - name: Build
        run: npm run build
