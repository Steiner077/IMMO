# Produktionsnahe Umgebung: docker compose --env-file .env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: immo
      POSTGRES_USER: immo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U immo -d immo']
      interval: 10s
      retries: 5

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://immo:${POSTGRES_PASSWORD}@db:5432/immo?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET setzen (min. 32 Zeichen)}
      CORS_ORIGINS: https://${ADMIN_DOMAIN},https://${TENANT_DOMAIN}
      STORAGE_DIR: /data/storage
      AUTOMATION_ENABLED: 'true'
      LOG_LEVEL: info
    volumes:
      - storage:/data/storage

  web:
    build: { context: ., dockerfile: deploy/frontend.Dockerfile, args: { APP: web } }
    restart: unless-stopped

  tenant:
    build: { context: ., dockerfile: deploy/frontend.Dockerfile, args: { APP: tenant } }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      TENANT_DOMAIN: ${TENANT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api, web, tenant]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://immo:${POSTGRES_PASSWORD}@db:5432/immo
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
      - storage:/data/storage:ro
    # Täglich um 02:00 Uhr (Container-Zeit UTC)
    entrypoint: ['/bin/sh', '-c', 'echo "0 2 * * * /scripts/backup.sh >> /backups/backup.log 2>&1" | crontab - && crond -f -l 8']

volumes:
  db-data:
  storage:
  caddy-data:
